[package]
name = "engage-inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Rust and WebAssembly team work console for Engage"

[dependencies]
serde_json = "1"
pulldown-cmark = "0.13"
ammonia = "4"
urlencoding = "2"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-file = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location", "History", "Url", "UrlSearchParams", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "FileList", "File", "KeyboardEvent", "MediaQueryList", "Storage"] }
console_error_panic_hook = "0.1"

[lints]
workspace = true
