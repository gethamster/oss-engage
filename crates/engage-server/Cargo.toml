[package]
name = "engage-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust HTTP server, authentication, feeds, and blob transport for Engage"

[dependencies]
engage-core = { path = "../engage-core" }
engage-store = { path = "../engage-store" }
engage-sync = { path = "../engage-sync" }
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
object_store = { version = "0.14", features = ["aws"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
aws-lc-rs = "1"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
